version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  api1:
    build:
      context: ./src/LivePulse.Api
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__Redis=redis:6379
      - NODE_NAME=Node-Alpha
    depends_on:
      - redis

  api2:
    build:
      context: ./src/LivePulse.Api
      dockerfile: Dockerfile
    ports:
      - "5001:8080"
    environment:
      - ConnectionStrings__Redis=redis:6379
      - NODE_NAME=Node-Beta
    depends_on:
      - redis